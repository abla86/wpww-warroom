services:
  wpww-warroom:
    build: .
    ports:
      - "${WPWW_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      RADAR_URL: "${RADAR_URL:-http://host.docker.internal:5080}"
      SIMULATE_PATH: "${SIMULATE_PATH:-/api/v1/internal/legacy-db-dump}"
      WPWW_ENABLE_SIMULATOR: "${WPWW_ENABLE_SIMULATOR:-true}"
      WPWW_ENABLE_TELEMETRY: "${WPWW_ENABLE_TELEMETRY:-false}"
      WPWW_ENABLE_CI: "${WPWW_ENABLE_CI:-false}"
      WPWW_ENABLE_AUDIO: "${WPWW_ENABLE_AUDIO:-true}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  network-sniffer:
    profiles: ["telemetry"]
    build:
      context: ./network-sniffer
    environment:
      WPWW_URL: "http://wpww-warroom:8080/healthz"
      RADAR_URL: "${RADAR_URL:-http://host.docker.internal:5080/health}"
      SNIFFER_INTERVAL: "${SNIFFER_INTERVAL:-10}"
      SNIFFER_TIMEOUT: "${SNIFFER_TIMEOUT:-2}"
    depends_on:
      wpww-warroom:
        condition: service_healthy
    restart: unless-stopped

  threat-simulator:
    profiles: ["simulation"]
    build:
      context: ./tools
    environment:
      WPWW_URL: "http://wpww-warroom:8080"
      SIMULATOR_INTERVAL: "${SIMULATOR_INTERVAL:-15}"
    depends_on:
      wpww-warroom:
        condition: service_healthy
    restart: unless-stopped

  evolution-lab:
    profiles: ["evolution"]
    build:
      context: ./evolution-attacker
    environment:
      WPWW_URL: "http://wpww-warroom:8080"
      EVOLUTION_STEPS: "${EVOLUTION_STEPS:-12}"
      EVOLUTION_EPSILON: "${EVOLUTION_EPSILON:-0.20}"
      EVOLUTION_PAUSE: "${EVOLUTION_PAUSE:-2}"
      EVOLUTION_LOG: "/data/attacker_evolution.jsonl"
    volumes:
      - evolution_data:/data
    depends_on:
      wpww-warroom:
        condition: service_healthy
    restart: "no"

volumes:
  evolution_data:

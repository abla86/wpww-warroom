services:
  wpww-warroom:
    build: .
    ports:
      - "${WPWW_PORT:-8080}:8080"
    environment:
      WPWW_LAB_PORT: "8080"
      WPWW_DATA_DIR: "/data"
      WPWW_USER_FILES_DIR: "/app/user_files"
      WPWW_PERSONALITY: "${WPWW_PERSONALITY:-cozy}"
      WPWW_ENABLE_SIMULATOR: "${WPWW_ENABLE_SIMULATOR:-true}"
      WPWW_ENABLE_TELEMETRY: "${WPWW_ENABLE_TELEMETRY:-true}"
      WPWW_ENABLE_AUDIO: "${WPWW_ENABLE_AUDIO:-true}"
      WPWW_ENABLE_HISTORY: "${WPWW_ENABLE_HISTORY:-true}"
      WPWW_ENABLE_ALERTS: "${WPWW_ENABLE_ALERTS:-true}"
      WPWW_ENABLE_REPLAY: "${WPWW_ENABLE_REPLAY:-true}"
      WPWW_ENABLE_REPORTS: "${WPWW_ENABLE_REPORTS:-true}"
      WPWW_ENABLE_EVOLUTION: "${WPWW_ENABLE_EVOLUTION:-true}"
      WPWW_ENABLE_FILE_AUDIT: "${WPWW_ENABLE_FILE_AUDIT:-true}"
      WPWW_ENABLE_DATABASE_LAB: "${WPWW_ENABLE_DATABASE_LAB:-true}"
      WPWW_ENABLE_PLUGIN_LAB: "${WPWW_ENABLE_PLUGIN_LAB:-true}"
      WPWW_MASTER_KEY: "${WPWW_MASTER_KEY:-}"
      WPWW_MASTER_SESSION_TTL: "${WPWW_MASTER_SESSION_TTL:-3600}"
      WPWW_MASTER_KEY_FILE: "${WPWW_MASTER_KEY_FILE:-}"
      WPWW_RESTART_POLICY: "unless-stopped"
      WPWW_HEAL_INTERVAL: "${WPWW_HEAL_INTERVAL:-20}"
      WPWW_MAX_EVENT_LOG_BYTES: "${WPWW_MAX_EVENT_LOG_BYTES:-20971520}"
      WPWW_WEBHOOK_URL: "${WPWW_WEBHOOK_URL:-}"
    volumes:
      - wpww_data:/data
      - ./lab/user_files:/app/user_files
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  wpww_data:

# Docker Secret kan aktiveres eksplisitt ved å sette WPWW_MASTER_KEY_FILE.
# Lokal utvikling kan bruke WPWW_MASTER_KEY uten secret-fil.

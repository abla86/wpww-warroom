services:
  postgres:
    profiles: [db-postgres]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wpww
      POSTGRES_USER: wpww
      POSTGRES_PASSWORD: wpww-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpww -d wpww"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    profiles: [db-mysql]
    image: mysql:9.4
    environment:
      MYSQL_DATABASE: wpww
      MYSQL_USER: wpww
      MYSQL_PASSWORD: wpww-local-only
      MYSQL_ROOT_PASSWORD: wpww-root-local-only
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  mariadb:
    profiles: [db-mariadb]
    image: mariadb:12
    environment:
      MARIADB_DATABASE: wpww
      MARIADB_USER: wpww
      MARIADB_PASSWORD: wpww-local-only
      MARIADB_ROOT_PASSWORD: wpww-root-local-only
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    profiles: [db-mongodb]
    image: mongo:8
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: [db-redis]
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sqlite-lab:
    profiles: [db-sqlite]
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /data && printf 'WPWW SQLite lab placeholder\\n' > /data/README.txt && tail -f /dev/null"]
    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:

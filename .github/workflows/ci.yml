name: WPWW CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wpww-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install --package-lock-only
      - run: node --check server.js
      - run: python3 -m py_compile verify_all.py
      - run: test -s public/index.html
      - run: test -s Dockerfile
      - run: test -s docker-compose.yml
      - run: test -s verify_all.py

  container-smoke:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build and start WPWW
        run: docker compose up --build -d
      - name: Wait for HTTP endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Run complete verification
        run: python3 verify_all.py
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Teardown
        if: always()
        run: docker compose down -v

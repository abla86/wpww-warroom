name: WPWW WarRoom CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax check
        run: |
          python -m compileall -q lab

      - name: Python module smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path('lab').resolve()))

          with tempfile.TemporaryDirectory() as tmp:
              os.environ['WPWW_DATA_DIR'] = tmp
              os.environ['WPWW_LEARNING_MATRIX'] = str(Path(tmp) / 'learning_matrix.json')

              import quality_evidence
              import learning_matrix
              import module_control
              import auto_healer
              import capability_registry

              assert learning_matrix.summary()['total'] >= 1
              assert module_control.snapshot()['control']['requireExplicitRun'] is True
              assert auto_healer.AutoHealer().snapshot()['enabled'] is True
              capabilities = capability_registry.snapshot()
              assert capabilities['counts']['plugins'] >= 1
              assert capabilities['counts']['tools'] >= 1

          print('Module smoke tests passed')
          PY

      - name: Docker Compose config check
        run: |
          docker compose config

      - name: Build WPWW
        run: |
          docker compose build --pull

      - name: Start WPWW
        run: |
          docker compose up -d

      - name: Wait for health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "WPWW healthcheck did not become ready"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify core API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8080/ > /tmp/root.json
          curl --fail --silent http://127.0.0.1:8080/api/warroom > /tmp/warroom.json
          curl --fail --silent http://127.0.0.1:8080/api/modules > /tmp/modules.json
          curl --fail --silent http://127.0.0.1:8080/api/capabilities > /tmp/capabilities.json
          curl --fail --silent http://127.0.0.1:8080/api/telemetry > /tmp/telemetry.json
          curl --fail --silent http://127.0.0.1:8080/api/tools > /tmp/tools.json
          curl --fail --silent http://127.0.0.1:8080/api/databases > /tmp/databases.json
          curl --fail --silent http://127.0.0.1:8080/api/battle > /tmp/battle.json
          curl --fail --silent http://127.0.0.1:8080/api/report.json > /tmp/report.json
          python - <<'PY'
          import json
          for path in (
              '/tmp/root.json', '/tmp/warroom.json', '/tmp/modules.json',
              '/tmp/capabilities.json', '/tmp/telemetry.json', '/tmp/tools.json',
              '/tmp/databases.json', '/tmp/battle.json', '/tmp/report.json'
          ):
              with open(path, encoding='utf-8') as f:
                  json.load(f)
          print('Core JSON endpoints parsed successfully')
          PY

      - name: Verify deterministic scenarios
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/scenario.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"scenario":"clean"}' \
            http://127.0.0.1:8080/api/scenario)
          test "$status" = "200"

          status=$(curl --silent --output /tmp/scenario-block.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"scenario":"deception"}' \
            http://127.0.0.1:8080/api/scenario)
          test "$status" = "200"

          python - <<'PY'
          import json
          with open('/tmp/scenario-block.json', encoding='utf-8') as f:
              event = json.load(f)
          assert event['statusCode'] == 403, event
          assert event['action'] == 'BLOCK_403', event
          print('Deception event verified as 403/BLOCK_403')
          PY

          status=$(curl --silent --output /tmp/scenario-missing.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"scenario":"does-not-exist"}' \
            http://127.0.0.1:8080/api/scenario)
          test "$status" = "404"

      - name: Verify report content
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8080/api/report.json > /tmp/report.json
          python - <<'PY'
          import json
          with open('/tmp/report.json', encoding='utf-8') as f:
              report = json.load(f)
          assert 'summary' in report
          assert 'events' in report
          assert 'files' in report
          assert 'modules' in report
          assert 'telemetry' in report
          assert 'capabilities' in report
          assert report['summary']['totalEvents'] >= 1
          print('Report structure and event content verified')
          PY

          curl --fail --silent http://127.0.0.1:8080/api/report.csv > /tmp/report.csv
          curl --fail --silent http://127.0.0.1:8080/api/report.html > /tmp/report.html
          test -s /tmp/report.csv
          test -s /tmp/report.html

      - name: Verify telemetry contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open('/tmp/telemetry.json', encoding='utf-8') as f:
              telemetry = json.load(f)
          assert telemetry.get('evidenceStatus') in {'OBSERVED', 'NOT_AVAILABLE'}
          assert 'timestampUtc' in telemetry
          print('Telemetry contract verified')
          PY

      - name: Verify battle lab contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open('/tmp/battle.json', encoding='utf-8') as f:
              battle = json.load(f)
          assert isinstance(battle.get('nodes'), list)
          assert any(n.get('side') == 'red' for n in battle['nodes'])
          assert any(n.get('side') == 'blue' for n in battle['nodes'])
          print('BattleLab contract verified')
          PY

      - name: Verify event feed integrity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8080/audit-logs > /tmp/audit.json
          python - <<'PY'
          import json
          with open('/tmp/audit.json', encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data, list)
          assert data, 'Expected at least one event after scenario tests'
          assert all('hash' in event and 'previousHash' in event for event in data)
          print(f'Event history verified: {len(data)} events')
          PY

      - name: Verify learning matrix and evidence states
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('lab').resolve()))
          import learning_matrix

          summary = learning_matrix.summary()
          assert summary['total'] >= 1
          assert 'evidence' in summary
          rows = learning_matrix.entries()
          allowed = {
              'OBSERVED', 'VERIFIED', 'TESTED', 'PASS',
              'FAIL', 'UNKNOWN', 'NOT_TESTED', 'NOT_APPLICABLE'
          }
          for row in rows:
              assert row.get('evidence', {}).get('status') in allowed
          print(json.dumps(summary, indent=2))
          PY

      - name: Verify master control isolation
        env:
          WPWW_MASTER_KEY: ci-test-master-secret
          WPWW_DATA_DIR: /tmp/wpww-master-ci
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WPWW_DATA_DIR"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('lab').resolve()))
          from master_control import issue_master_session, verify_master_session, revoke_master_session

          session = issue_master_session()
          assert session['role'] == 'MASTER'
          assert session['token']
          assert verify_master_session(session['token']) is True
          assert verify_master_session('invalid-token') is False
          revoke_master_session()
          assert verify_master_session(session['token']) is False
          print('Master session verification passed')
          PY

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Shutdown
        if: always()
        run: docker compose down -v
